[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eiennohito/oyabun"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = 1
split-debuginfo = "packed"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = "thin"

[profile.profiling.build-override]
debug = true
