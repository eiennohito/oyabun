[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = 1
split-debuginfo = "packed"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = "thin"

[profile.profiling.build-override]
debug = true
